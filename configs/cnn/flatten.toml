# Aplanado en vez de pooling global: conserva la posición temporal de cada rasgo.
nombre = "flatten"

[modelo]
filtros = [16, 32, 64]
kernels = [7, 5, 3]
pools = [2, 2, 2]
cabeza = "flatten"
ocultas = 32
dropout = 0.3

[entrenamiento]
tasa_aprendizaje = 1e-3
tamano_lote = 256
epocas_max = 30
paciencia = 5
paciencia_lr = 2
factor_lr = 0.1
hilos = 4
