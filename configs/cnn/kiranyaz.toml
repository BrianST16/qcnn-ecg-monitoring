# Adaptación de Kiranyaz et al. (2016): 2 convoluciones de 32 y 16 filtros, kernel 15, submuestreo 6 y MLP de 10 neuronas (más BatchNorm).
nombre = "kiranyaz"

[modelo]
filtros = [32, 16]
kernels = [15, 15]
pools = [6, 6]
cabeza = "flatten"
ocultas = 10
dropout = 0.3

[entrenamiento]
tasa_aprendizaje = 1e-3
tamano_lote = 256
epocas_max = 30
paciencia = 5
paciencia_lr = 2
factor_lr = 0.1
hilos = 4
