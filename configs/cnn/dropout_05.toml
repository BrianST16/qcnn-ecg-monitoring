# Variante base con más regularización (dropout 0.5).
nombre = "dropout_05"

[modelo]
filtros = [16, 32, 64]
kernels = [7, 5, 3]
pools = [2, 2, 2]
cabeza = "gap"
ocultas = 32
dropout = 0.5

[entrenamiento]
tasa_aprendizaje = 3e-4
tamano_lote = 256
epocas_max = 30
paciencia = 5
paciencia_lr = 2
factor_lr = 0.1
hilos = 4
